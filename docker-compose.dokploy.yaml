services:
  evolution-api:
    # Build from local code (recommended for development/updates)
    build:
      context: .
      dockerfile: Dockerfile
    image: evolution-api-lite:local
    
    # Alternative: Use pre-built image instead
    # Uncomment below and comment build section above to use pre-built image
    # image: atendai/evolution-api-lite:latest
    
    container_name: evolution-api
    restart: unless-stopped
    
    # Health check for Dokploy monitoring
    # Using curl instead of wget as it's available in Alpine by default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/instance/fetchInstances"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Port mapping - remove or comment out if using Traefik reverse proxy
    # Uncomment below if you need direct port access
    # ports:
    #   - "${SERVER_PORT:-8080}:8080"
    
    volumes:
      - evolution_instances:/evolution/instances
    
    networks:
      - evolution-net
    
    # Environment variables - Dokploy can override these via UI
    environment:
      # Server Configuration
      - SERVER_TYPE=${SERVER_TYPE:-http}
      - SERVER_PORT=8080
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - SERVER_DISABLE_DOCS=${SERVER_DISABLE_DOCS:-false}
      - SERVER_DISABLE_MANAGER=${SERVER_DISABLE_MANAGER:-false}
      
      # CORS
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CORS_METHODS=${CORS_METHODS:-POST,GET,PUT,DELETE}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      
      # Authentication
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-BQYHJGJHJ}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=${AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES:-false}
      
      # Database Configuration
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-postgresql}
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI:-postgresql://user:pass@postgres:5432/evolution}
      - DATABASE_CONNECTION_CLIENT_NAME=${DATABASE_CONNECTION_CLIENT_NAME:-evolution}
      
      # Database Save Data Configuration
      - DATABASE_SAVE_DATA_INSTANCE=${DATABASE_SAVE_DATA_INSTANCE:-true}
      - DATABASE_SAVE_DATA_NEW_MESSAGE=${DATABASE_SAVE_DATA_NEW_MESSAGE:-true}
      - DATABASE_SAVE_MESSAGE_UPDATE=${DATABASE_SAVE_MESSAGE_UPDATE:-true}
      - DATABASE_SAVE_DATA_CONTACTS=${DATABASE_SAVE_DATA_CONTACTS:-true}
      - DATABASE_SAVE_DATA_CHATS=${DATABASE_SAVE_DATA_CHATS:-true}
      - DATABASE_SAVE_DATA_HISTORIC=${DATABASE_SAVE_DATA_HISTORIC:-true}
      - DATABASE_SAVE_DATA_LABELS=${DATABASE_SAVE_DATA_LABELS:-true}
      - DATABASE_SAVE_IS_ON_WHATSAPP=${DATABASE_SAVE_IS_ON_WHATSAPP:-true}
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=${DATABASE_SAVE_IS_ON_WHATSAPP_DAYS:-7}
      
      # Redis Cache Configuration
      - CACHE_REDIS_ENABLED=${CACHE_REDIS_ENABLED:-true}
      - CACHE_REDIS_URI=${CACHE_REDIS_URI:-redis://redis:6379}
      - CACHE_REDIS_PREFIX_KEY=${CACHE_REDIS_PREFIX_KEY:-evolution-cache}
      - CACHE_REDIS_TTL=${CACHE_REDIS_TTL:-604800}
      - CACHE_REDIS_SAVE_INSTANCES=${CACHE_REDIS_SAVE_INSTANCES:-false}
      
      # Local Cache
      - CACHE_LOCAL_ENABLED=${CACHE_LOCAL_ENABLED:-true}
      
      # R2 Session Storage (Cloudflare R2)
      - R2_SESSION_STORAGE_ENABLED=${R2_SESSION_STORAGE_ENABLED:-false}
      
      # S3/R2 Configuration
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      
      # Provider Files (Alternative to R2)
      - PROVIDER_ENABLED=${PROVIDER_ENABLED:-false}
      - PROVIDER_HOST=${PROVIDER_HOST:-}
      - PROVIDER_PORT=${PROVIDER_PORT:-5656}
      - PROVIDER_PREFIX=${PROVIDER_PREFIX:-evolution}
      
      # Webhook Configuration
      - WEBHOOK_GLOBAL_ENABLED=${WEBHOOK_GLOBAL_ENABLED:-false}
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_GLOBAL_URL:-}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=${WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS:-false}
      
      # Websocket Configuration
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_GLOBAL_EVENTS=${WEBSOCKET_GLOBAL_EVENTS:-false}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS,WEBSOCKET}
      - LOG_COLOR=${LOG_COLOR:-true}
      - LOG_BAILEYS=${LOG_BAILEYS:-error}
      
      # Language
      - LANGUAGE=${LANGUAGE:-en}
      
      # Session Configuration
      - CONFIG_SESSION_PHONE_CLIENT=${CONFIG_SESSION_PHONE_CLIENT:-Evolution API}
      - CONFIG_SESSION_PHONE_NAME=${CONFIG_SESSION_PHONE_NAME:-Chrome}
      
      # QR Code Configuration
      - QRCODE_LIMIT=${QRCODE_LIMIT:-30}
      - QRCODE_COLOR=${QRCODE_COLOR:-#198754}
      
      # Instance Management
      - DEL_INSTANCE=${DEL_INSTANCE:-false}
      - DEL_TEMP_INSTANCES=${DEL_TEMP_INSTANCES:-true}
      
      # DOCKER_ENV for container detection
      - DOCKER_ENV=true
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Labels for Dokploy and Traefik
    labels:
      - "com.dokploy.app.name=evolution-api"
      - "com.dokploy.app.type=api"
      - "com.dokploy.app.version=2.2.1"
      
      # Traefik Labels - Configure for reverse proxy
      # Enable Traefik
      - "traefik.enable=true"
      
      # HTTP Router (optional, for HTTP access)
      # Replace ${DOMAIN} with your actual domain in Dokploy UI
      - "traefik.http.routers.evolution-api.rule=Host(`evolution-api.localhost`)"
      - "traefik.http.routers.evolution-api.entrypoints=web"
      - "traefik.http.routers.evolution-api.service=evolution-api"
      
      # HTTPS Router (recommended - change domain in Dokploy UI)
      # Dokploy will replace ${DOMAIN} with your configured domain
      - "traefik.http.routers.evolution-api-secure.rule=Host(`evolution-api.localhost`)"
      - "traefik.http.routers.evolution-api-secure.entrypoints=websecure"
      - "traefik.http.routers.evolution-api-secure.service=evolution-api"
      - "traefik.http.routers.evolution-api-secure.tls=true"
      - "traefik.http.routers.evolution-api-secure.tls.certresolver=letsencrypt"
      
      # Service Configuration
      - "traefik.http.services.evolution-api.loadbalancer.server.port=8080"
      - "traefik.http.services.evolution-api.loadbalancer.passHostHeader=true"
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    command: 
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks:
      - evolution-net
    
    # Expose port only if you need external access
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    
    labels:
      - "com.dokploy.app.name=evolution-postgres"
      - "com.dokploy.app.type=database"
      - "traefik.enable=false"
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    command: 
      - "redis-server"
      - "--port"
      - "6379"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    
    volumes:
      - redis_data:/data
    
    networks:
      - evolution-net
    
    # Expose port only if you need external access
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    
    labels:
      - "com.dokploy.app.name=evolution-redis"
      - "com.dokploy.app.type=cache"
      - "traefik.enable=false"
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  evolution_instances:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  evolution-net:
    driver: bridge
    name: evolution-net
  # Uncomment below to use Traefik's network (if Traefik is on a different network)
  # traefik-public:
  #   external: true

